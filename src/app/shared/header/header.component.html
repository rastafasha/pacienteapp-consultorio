<!-- header -->
<header>
    <div class="header">
        <div class="container">
            <div class="tope">
                <a routerLink="/app/home">
                    <div class="logo">
                        <!-- <img src="./assets/images/logomalcolm.png" alt="logo "> -->
                    </div>
                </a>
                <a routerLink="/app/home">
                    <div class="logo logo2">
                        <!-- <img src="./assets/images/logomalcolm.png" alt="logo "> -->
                    </div>
                </a>
                <div class="top">
                    <h2>Klyntic</h2>
                    <h4>Paciente</h4>
                </div>
                <div class="menuright">

                    <div class="d-flex align-items-center gap-3">

                        <!-- Icono del Modo Oscuro (Luna) -->
                        <!-- <button type="button" class="btn p-1 border-0" (click)="darkMode('dark')">
                            <i class="fa-solid fa-moon text-dark fs-5"></i>
                        </button> -->

                        <!-- =========================================================================
     🔔 ESTRUCTURA ANCLA DE LA CAMPANA PREMIUM RE-INGENIERADA (PACIENTES)
     ========================================================================= -->
                        <div class="bell-wrapper" (click)="navegarANotificaciones()">
                            <!-- Icono nativo de FontAwesome de tu plantilla -->
                            <i class="fa-solid fa-bell"></i>

                            <!-- 🚀 RENDERING ASÍNCRONO MULTI-DÍGITO: 
       *ngIf lee unreadCount$ a través del pipe 'async'. 
       Si el conteo es mayor a 0, inyecta la píldora y le clava la animación. -->
                            <div class="notification-badge" *ngIf="(unreadCount$ | async) as count; else noAlerts">
                                <ng-container *if="count > 0">
                                    {{ count }}
                                </ng-container>
                            </div>

                            <!-- Fallback invisible por si no hay alertas (evita saltos bruscos en el layout) -->
                            <ng-template #noAlerts></ng-template>
                        </div>

                        <!-- Botón del Menú Lateral (El de las tres rayitas de la derecha) -->
                        <button class="btn border p-2.5 rounded-pill d-flex align-items-center justify-content-center"
                            type="button" (click)="openMenu()" style="width: 44px; height: 44px; background: #ffffff;">
                            <i class="fa-solid fa-bars text-dark fs-5"></i>
                        </button>

                    </div>

                    <div class="sidemenu">
                        <a href="javascript:void(0)" (click)="closeMenu()" class="close"></a>
                        <nav>
                            <ul>
                                <li>
                                    <a routerLink="/app/home">
                                        <i class="fa fa-info-circle"></i>&nbsp;Hola {{patient?.name}}!
                                    </a>
                                </li>
                                <li>
                                    <a routerLink="/app/ayuda">
                                        <i class="fa fa-life-ring"></i>&nbsp; Ayuda en Línea
                                    </a>
                                </li>

                                <li>
                                    <a routerLink="/app/legal">
                                        <i class="fa fa-balance-scale"></i>&nbsp; Información legal
                                    </a>
                                </li>
                                <li>
                                    <a (click)="logout()">
                                        <i class="fa fa-sign-out"></i>&nbsp; Salir
                                    </a>
                                </li>
                            </ul>
                        </nav>

                        <div class="creditos">
                            <p>Copyright © {{year}} Klyntic <br> Todos los derechos reservados.</p>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>


</header>
<!-- header -->
<div class="clear"></div>
