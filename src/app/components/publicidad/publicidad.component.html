<!-- MIENTRAS CARGA LA API: Esqueleto animado Premium -->
<div class="publicidad-carousel-wrapper" *ngIf="cargando">
  <div class="publicidad_home">
    <div class="publicidad_home_item placeholder-glow" style="background: #f1f5f9;">
      <div class="placeholder w-100 h-100" style="background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: loading-shimmer 1.5s infinite;"></div>
    </div>
  </div>
</div>

<!-- CUANDO LA DATA ESTÁ LISTA -->
<div class="publicidad-carousel-wrapper" *ngIf="!cargando && pubs && pubs.length > 0">
  <div class="publicidad_home">
    
    <!-- Iteración de los anuncios activos -->
    <div class="publicidad_home_item" *ngFor="let pub of pubs">
      <!-- Si la imagen viene directo de tu storage o API -->
      <img [src]="pub.imagen_url || pub.imagen" [alt]="pub.titulo || 'Publicidad Klyntic'">
    </div>

  </div>
</div>

<!-- ESTILO LOCAL DE ANIMACIÓN SKELETON (SHIMMER EFFECT) -->
<style>
  @keyframes loading-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
